<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Tejas Hande</title>
  <meta name="description" content="The page you were looking for could not be found. Return to Tejas Hande's portfolio." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/webp" href="images/Tejas.webp" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f17;
      color: #f9fafb;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 540px;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }
    .code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #f9fafb;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="code">404</div>
    <h1>Resource Not Found</h1>
    <p>
      The page or asset you requested is unavailable or has been relocated. You can navigate back to the home portfolio or browse featured engineering projects.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">&larr; Return to Homepage</a>
      <a href="/#projects" class="btn btn-secondary">Explore Projects</a>
    </div>
  </main>
</body>

</html>
